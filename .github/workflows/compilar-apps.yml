# Compila Lapticon para Android (APK) e iOS (IPA sin firmar + .app para simulador).
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON           obligatorio. Contenido completo de google-services.json (repo de documentación,
#                                  referencias/google-services.json; no se sube).
#   GOOGLE_SERVICE_INFO_PLIST      opcional. GoogleService-Info.plist de una app iOS registrada en Firebase
#                                  (bundle com.lapticon.app). Sin él iOS compila con los datos del cliente Android,
#                                  pero la app se cierra al abrir: Firebase en iOS rechaza un appId de Android.
#   ANDROID_DEBUG_KEYSTORE_BASE64  opcional. `base64 -i ~/.android/debug.keystore`. Con él, todos los APK salen
#                                  firmados con la misma llave y se pueden instalar encima del anterior.
#
# Las carpetas android/ e ios/ que falten las genera el propio runner; nada de lo generado se sube al repo.
# Cada push a main actualiza la Release "última versión" (enlace fijo .../releases/latest/download/lapticon.apk)
# y cada tag `practica-*` deja además una Release propia.

name: Compilar apps

on:
  push:
    branches: [main]
    tags: ['practica-*']
  workflow_dispatch:

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  APP_ID: com.lapticon.app

jobs:
  calidad:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configurar Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICES_JSON (contenido de google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          flutter pub get
          dart run tool/generate_firebase_options.dart "$RUNNER_TEMP/google-services.json" "$APP_ID"

      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configurar Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICES_JSON (contenido de google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          flutter pub get
          dart run tool/generate_firebase_options.dart "$RUNNER_TEMP/google-services.json" "$APP_ID"
          cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json

      - name: Llave de firma estable (opcional)
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Usando la llave de firma del secreto."
          else
            echo "::warning::Sin ANDROID_DEBUG_KEYSTORE_BASE64: cada APK sale con una llave distinta y hay que desinstalar la versión anterior."
          fi

      - name: Compilar APK
        # Maven Central a veces responde 403 a los runners de GitHub; se reintenta antes de rendirse.
        run: |
          for intento in 1 2 3; do
            if flutter build apk --release --build-number=${{ github.run_number }}; then exit 0; fi
            echo "::warning::Falló el intento $intento de compilar el APK; reintentando en 60 s."
            sleep 60
          done
          exit 1

      - name: Renombrar
        run: |
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/salida/lapticon-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: lapticon-android
          path: salida/*.apk
          retention-days: 30

  ios:
    name: IPA iOS (sin firmar)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      # Solo con el plist de Firebase para iOS la app abre; sin él no se publica en la Release.
      firebase_ios: ${{ steps.firebase.outputs.firebase_ios }}
    steps:
      - uses: actions/checkout@v6

      # firebase-ios-sdk 13 (lo trae firebase_core 5) exige Swift 6.2, es decir, Xcode 26 o superior.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generar ios/ si no existe
        run: |
          if [ ! -d ios ]; then
            flutter create . --no-pub --org com.lapticon --project-name lapticon_app --platforms ios
          fi
          # Con Swift Package Manager, `pub get` falla al copiar los plugins si esta carpeta no existe aún.
          mkdir -p build/ios/SourcePackages
          # Mismo identificador que Android, nombre visible y iOS 15 (mínimo que exige el SDK de Firebase).
          perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = com\.lapticon\.lapticonApp/PRODUCT_BUNDLE_IDENTIFIER = com.lapticon.app/g; s/IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          plutil -replace CFBundleDisplayName -string Lapticon ios/Runner/Info.plist
          if [ -f ios/Podfile ]; then
            perl -pi -e "s/^#?\s*platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/Podfile
          fi

      - name: Configurar Firebase (Android + iOS)
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICES_JSON (contenido de google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "firebase_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin GOOGLE_SERVICE_INFO_PLIST la app de iOS compila pero se cierra al abrir (Firebase rechaza el appId de Android). Ver docs/08 §4 del repo de documentación."
          fi
          # El generador del repo solo conoce Android; aquí se escribe una versión con iOS sin tocar tool/.
          python3 - "$RUNNER_TEMP/google-services.json" "$APP_ID" ios/Runner/GoogleService-Info.plist <<'PY'
          import json, os, plistlib, sys
          gs_path, app_id, plist_path = sys.argv[1:4]
          gs = json.load(open(gs_path))
          project = gs['project_info']
          client = next(c for c in gs['client']
                        if c['client_info']['android_client_info']['package_name'] == app_id)
          android = {
              'apiKey': client['api_key'][0]['current_key'],
              'appId': client['client_info']['mobilesdk_app_id'],
              'messagingSenderId': project['project_number'],
              'projectId': project['project_id'],
              'storageBucket': project['storage_bucket'],
          }
          ios = dict(android, iosBundleId=app_id)
          if os.path.exists(plist_path):
              p = plistlib.load(open(plist_path, 'rb'))
              ios.update(apiKey=p['API_KEY'], appId=p['GOOGLE_APP_ID'],
                         messagingSenderId=p['GCM_SENDER_ID'], projectId=p['PROJECT_ID'],
                         storageBucket=p.get('STORAGE_BUCKET', android['storageBucket']),
                         iosBundleId=p.get('BUNDLE_ID', app_id))
          def opciones(nombre, o):
              campos = ''.join(f"    {k}: '{v}',\n" for k, v in o.items())
              return f"  static const FirebaseOptions {nombre} = FirebaseOptions(\n{campos}  );\n"
          open('lib/firebase_options.dart', 'w').write(
              "// ARCHIVO GENERADO en GitHub Actions. No editar a mano.\n"
              "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\n"
              "import 'package:flutter/foundation.dart'\n"
              "    show defaultTargetPlatform, kIsWeb, TargetPlatform;\n\n"
              "class DefaultFirebaseOptions {\n"
              "  static FirebaseOptions get currentPlatform {\n"
              "    if (kIsWeb) {\n"
              "      throw UnsupportedError('Lapticon no está configurado para web.');\n"
              "    }\n"
              "    switch (defaultTargetPlatform) {\n"
              "      case TargetPlatform.android:\n"
              "        return android;\n"
              "      case TargetPlatform.iOS:\n"
              "        return ios;\n"
              "      default:\n"
              "        throw UnsupportedError('Plataforma no configurada.');\n"
              "    }\n"
              "  }\n\n"
              + opciones('android', android) + "\n" + opciones('ios', ios) + "}\n")
          print('lib/firebase_options.dart generado (appId iOS: %s)' % ios['appId'])
          PY

      - name: Compilar para iPhone (sin firmar)
        run: |
          flutter pub get
          if [ -f ios/Podfile ]; then
            perl -pi -e "s/^#?\s*platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/Podfile
          fi
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Empaquetar IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/salida" Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/salida/lapticon-${{ github.run_number }}-sin-firmar.ipa" Payload

      - name: Compilar para el simulador
        run: |
          flutter build ios --simulator --debug --build-number=${{ github.run_number }}
          cd build/ios/iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/salida/lapticon-${{ github.run_number }}-simulador.zip" Runner.app

      - uses: actions/upload-artifact@v6
        with:
          name: lapticon-ios
          path: |
            salida/*.ipa
            salida/*.zip
          retention-days: 30

  # Cada push a main reemplaza la Release `ultima` (marcada como "Latest"); cada tag practica-* deja una fija.
  # Los archivos tienen nombre estable, así que este enlace siempre baja el APK más reciente:
  #   https://github.com/<dueño>/<repo>/releases/latest/download/lapticon.apk
  publicar:
    name: Publicar Release
    # Basta con que el APK salga bien: si iOS falla, igual se publica Android.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: lapticon-android
          path: salida

      - uses: actions/download-artifact@v7
        if: ${{ needs.ios.outputs.firebase_ios == 'true' }}
        with:
          name: lapticon-ios
          path: salida

      - name: Nombres estables
        run: |
          cd salida
          mv lapticon-*.apk lapticon.apk
          for f in lapticon-*-sin-firmar.ipa; do if [ -e "$f" ]; then mv "$f" lapticon-ios-sin-firmar.ipa; fi; done
          for f in lapticon-*-simulador.zip; do if [ -e "$f" ]; then mv "$f" lapticon-ios-simulador.zip; fi; done
          ls -la

      - name: Crear la Release
        run: |
          URL="https://github.com/$GH_REPO/releases/latest/download/lapticon.apk"
          {
            echo "## Descargar"
            echo
            echo "**Android:** [lapticon.apk]($URL). Ábrelo en el teléfono y permite \"instalar apps desconocidas\"."
            echo
            if [ -e salida/lapticon-ios-sin-firmar.ipa ]; then
              echo "**iPhone:** \`lapticon-ios-sin-firmar.ipa\`, instalar con Sideloadly y tu Apple ID (ver [docs/08](https://github.com/HaroldCCS/umb-computacion-movil-portal-encomiendas-lapicon/blob/main/docs/08-compilacion-y-pruebas-ios.md))."
              echo "**Simulador iOS (Mac):** \`lapticon-ios-simulador.zip\`, descomprimir y arrastrar al simulador."
            else
              echo "**iPhone:** todavía no disponible (falta la configuración de Firebase para iOS, ver [docs/08](https://github.com/HaroldCCS/umb-computacion-movil-portal-encomiendas-lapicon/blob/main/docs/08-compilacion-y-pruebas-ios.md))."
            fi
            echo
            echo "Compilación #${{ github.run_number }} · commit ${GITHUB_SHA::7}"
          } > notas.md

          if [[ "$GITHUB_REF" == refs/tags/practica-* ]]; then
            gh release create "$GITHUB_REF_NAME" salida/* --verify-tag --latest \
              --title "Lapticon $GITHUB_REF_NAME" --notes-file notas.md
          else
            gh release delete ultima --cleanup-tag --yes || true
            gh release create ultima salida/* --target "$GITHUB_SHA" --latest \
              --title "Lapticon · última versión (#${{ github.run_number }})" --notes-file notas.md
          fi
